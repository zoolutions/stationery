# What conformance-kit holds this gem to (zoolutions/phlex-reactive#363):
# `bundle exec conformance-kit check` runs it all, as the Conformance workflow
# does on Ruby 4.0.
audit:
  require: [./spec/conformance_eager_load.rb]
  namespace: [Stationery]
  strict_autoloads: true
ractor:
  test_command: bundle exec rspec --tag ractor
probes:
  gem_name: stationery
