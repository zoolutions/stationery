name: Deploy docs
# Build + deploy via docs-kit's reusable workflow (defined once for all sites).
# Its defaults fit this repo: build context "." (the repo root, for the path gem),
# dockerfile docs/Dockerfile, and docs/ as the app holding config/deploy.yml.
on:
  release: { types: [published] }
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    uses: zoolutions/docs-kit/.github/workflows/deploy.yml@main
    with:
      image: zoolutions/stationery
      service: stationery
    secrets: inherit
