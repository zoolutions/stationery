name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
      - name: Verify gem builds
        run: gem build stationery.gemspec --strict

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Specs
        run: bundle exec rspec
      - name: Examples render
        run: bundle exec rake examples

  metrics:
    runs-on: ubuntu-latest
    name: Metrics gate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4" # the Ruby benchmark/baseline.json was recorded with
          bundler-cache: true
      - name: Allocations, pages and bytes against the baseline
        run: bundle exec rake metrics

  conformance:
    runs-on: ubuntu-latest
    name: PDF/A and PDF/UA (veraPDF)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: veraPDF validates the conforming examples
        run: bundle exec rake verify:conformance
      - name: Mustang validates the Factur-X example
        run: bundle exec rake verify:factur_x
      - name: Install pdfsig (poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: openssl and pdfsig verify the signed example
        run: bundle exec rake verify:signature
      - name: Render the readers' corpus
        run: bundle exec rake verify:readers:render
      - name: Build the verify image (qpdf, Poppler, MuPDF, PDFium, pdf.js)
        run: docker build -f docker/verify/Dockerfile -t stationery-verify .
      - name: The verify image checks the readers' corpus
        run: |
          cd tmp/readers
          plain=$(ls *.pdf | grep -v '^encrypted_' | sed 's|^|/data/|')
          docker run --rm -v "$PWD:/data:ro" stationery-verify $plain
          docker run --rm -v "$PWD:/data:ro" stationery-verify --password reader /data/encrypted_invoice.pdf

  readers-macos:
    runs-on: macos-latest
    name: Readers (macOS, PDFKit)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install qpdf, Poppler and MuPDF
        run: brew install qpdf poppler mupdf
      - name: qpdf, Poppler, MuPDF and PDFKit check the readers' corpus
        run: bundle exec rake verify:readers
        env:
          ENGINES: qpdf,poppler,mupdf,pdfkit
      - name: "Temporary: PDFKit's text of the report's page 4"
        if: failure()
        run: swift lib/stationery/verify/scripts/pdfkit.swift tmp/readers/report.pdf | ruby -rjson -e 'p JSON.parse($stdin.read)["pages"][3]["text"]'

  rails:
    runs-on: ubuntu-latest
    name: Rails
    env:
      BUNDLE_GEMFILE: gemfiles/rails.gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Rails specs
        run: bundle exec rake spec:rails

  docs:
    runs-on: ubuntu-latest
    name: Docs site
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs
      - uses: oven-sh/setup-bun@v2
      - name: Build CSS
        run: bun install --frozen-lockfile && bun run build:css
      - name: RuboCop
        run: bundle exec rubocop
      - name: Specs (every page, its .md twin, README/CHANGELOG sections)
        run: bundle exec rspec
