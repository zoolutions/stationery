name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
      - name: Verify gem builds
        run: gem build stationery.gemspec --strict

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Specs
        run: bundle exec rspec
      - name: Examples render
        run: bundle exec rake examples

  conformance:
    runs-on: ubuntu-latest
    name: PDF/A and PDF/UA (veraPDF)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: veraPDF validates the conforming examples
        run: bundle exec rake verify:conformance

  rails:
    runs-on: ubuntu-latest
    name: Rails
    env:
      BUNDLE_GEMFILE: gemfiles/rails.gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Rails specs
        run: bundle exec rake spec:rails

  docs:
    runs-on: ubuntu-latest
    name: Docs site
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs
      - uses: oven-sh/setup-bun@v2
      - name: Build CSS
        run: bun install --frozen-lockfile && bun run build:css
      - name: RuboCop
        run: bundle exec rubocop
      - name: Specs (every page, its .md twin, README/CHANGELOG sections)
        run: bundle exec rspec
