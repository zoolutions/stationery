# The label taxonomy for zoolutions/stationery — the single source of truth.
#
# `bin/labels sync` makes GitHub match this file; `bin/labels validate` checks it
# offline. The rules live in .github/LABELS.md.
#
# Every label outside the `area` group, and the shared `devops`/`dx`/`docs-site`
# areas, come from docs-kit's labels kit (LABELS_KIT.md) and must stay identical
# to docs-kit's copy (`script/labels-kit check`). The other areas are this repo's.
---
ignore: []

labels:
  # ---------------------------------------------------------------- type ----
  # Exactly one per issue/PR: what kind of work this is.
  - name: bug
    color: d73a4a
    description: Something isn't working
    group: type
  - name: enhancement
    color: a2eeef
    description: New feature or request
    group: type
  - name: performance
    color: fbca04
    description: Faster or leaner with no change in behaviour
    group: type
  - name: tech-debt
    color: 9c27bb
    description: Refactoring or cleanup that pays down an accepted shortcut
    group: type
  - name: security
    color: "e9e257"
    description: Vulnerability, hardening, or an authorization correctness fix
    group: type
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
    group: type
  - name: dependencies
    color: d93f0b
    description: Changes dependencies in some way
    group: type
  - name: chore
    color: ededed
    description: CI, tooling or configuration work with no behaviour change
    group: type

  # ---------------------------------------------------------------- area ----
  # One or more per issue/PR: which part of the code it touches. Shared first.
  - name: devops
    color: 006b75
    description: CI, the release kit, Docker, deploys and infrastructure
    group: area
  - name: dx
    color: 16a085
    description: Developer experience — agent commands and rules, generators, local tooling
    group: area
  - name: docs-site
    color: 2ea44f
    description: The documentation site under docs/
    group: area
  # stationery's own areas.
  - name: layout
    color: 1d76db
    description: The layout engine — boxes, columns, tables, pagination and regions
    group: area
  - name: text
    color: 0366d6
    description: Text shaping, line breaking and hyphenation
    group: area
  - name: fonts
    color: 7eafec
    description: Font loading, subsetting and embedding
    group: area
  - name: pdf
    color: 5b8def
    description: The PDF writer and document structure
    group: area
  - name: images
    color: 3e6abd
    description: Images, rasterization and monochrome output
    group: area
  - name: svg
    color: 1f6feb
    description: SVG rendering
    group: area
  - name: canvas
    color: 0e8a16
    description: The drawing canvas and paths
    group: area
  - name: markup
    color: 42b204
    description: HTML, CSS, Markdown and rich text input
    group: area
  - name: forms
    color: 1abc9c
    description: PDF form fields
    group: area
  - name: tagging
    color: 6fbf73
    description: Tagged PDF and accessibility structure
    group: area
  - name: conformance
    color: 017cf4
    description: PDF verification and standards conformance (PDF/A, PDF/UA)
    group: area
  - name: barcodes
    color: 0052cc
    description: Barcodes and ZPL label printing
    group: area
  - name: rails
    color: "300e84"
    description: The Rails integration and previews
    group: area
  - name: cli
    color: 5319a0
    description: The stationery CLI
    group: area
  - name: testing
    color: 0a6847
    description: The test helpers and RSpec matchers shipped to host apps
    group: area

  # -------------------------------------------------------------- status ----
  # Where an issue is in its lifecycle. Never on a pull request.
  - name: plan
    color: 6f42c1
    description: Has a /plan body with Context, Decision, Steps and Gates; ready for /lfg
    group: status
  - name: epic
    color: "5319e7"
    description: Umbrella item tracking several smaller issues
    group: status
  - name: blocker
    color: 8a63d2
    description: Blocks other work or a release until it is resolved
    group: status
  - name: needs-info
    color: d4c5f9
    description: Waiting on details before it can be planned or worked on
    group: status
  - name: priority
    color: b60205
    description: Next up — picked ahead of the rest of the backlog
    group: status

  # ----------------------------------------------------------- community ----
  # GitHub's defaults, kept because GitHub surfaces them to contributors.
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
    group: community
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
    group: community
  - name: question
    color: d876e3
    description: Further information is requested
    group: community
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
    group: community
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
    group: community
  - name: wontfix
    color: ffffff
    description: This will not be worked on
    group: community

# Path globs -> area label, used by `bin/labels infer` and by /plan and /lfg to
# label deterministically from a diff. Matched with File.fnmatch and
# File::FNM_PATHNAME | File::FNM_EXTGLOB: write a recursive glob as `**/*`. A
# path may match several globs — every matching area applies.
paths:
  "lib/stationery/{layout,elements}/**/*": layout
  "lib/stationery/{layout,elements}.rb": layout
  "lib/stationery/{regions,units}.rb": layout
  "lib/stationery/{text,hyphenation}/**/*": text
  "lib/stationery/{text,hyphenation}.rb": text
  "lib/stationery/shaper.rb": text
  "lib/stationery/fonts/**/*": fonts
  "lib/stationery/pdf/**/*": pdf
  "lib/stationery/{structure,resources,warnings}.rb": pdf
  "lib/stationery/{images,raster,monochrome}/**/*": images
  "lib/stationery/{images,raster,monochrome}.rb": images
  "lib/stationery/svg/**/*": svg
  "lib/stationery/canvas/**/*": canvas
  "lib/stationery/canvas.rb": canvas
  "lib/stationery/path.rb": canvas
  "lib/stationery/{html,css,markdown,rich}/**/*": markup
  "lib/stationery/{html,css,markdown,rich}.rb": markup
  "lib/stationery/forms/**/*": forms
  "lib/stationery/tagging/**/*": tagging
  "lib/stationery/verify/**/*": conformance
  "lib/stationery/verify.rb": conformance
  "lib/stationery/{barcode,zpl}/**/*": barcodes
  "lib/stationery/{barcode,zpl}.rb": barcodes
  "lib/stationery/rails/**/*": rails
  "lib/stationery/{rails,railtie,preview}.rb": rails
  "lib/stationery/cli/**/*": cli
  "lib/stationery/cli.rb": cli
  "exe/**/*": cli
  "lib/stationery/testing/**/*": testing
  "lib/stationery/rspec.rb": testing
  "lib/stationery/skill/**/*": dx
  "lib/stationery/skill.rb": dx
  "{benchmark,examples}/**/*": dx
  "spec/stationery/{layout,elements}/**/*": layout
  "spec/stationery/{layout,elements}_spec.rb": layout
  "spec/stationery/{regions,units}_spec.rb": layout
  "spec/stationery/{text,hyphenation}/**/*": text
  "spec/stationery/{text,hyphenation}_spec.rb": text
  "spec/stationery/shaper_spec.rb": text
  "spec/stationery/shaper_*_spec.rb": text
  "spec/stationery/fonts/**/*": fonts
  "spec/stationery/fonts_spec.rb": fonts
  "spec/stationery/pdf/**/*": pdf
  "spec/stationery/{structure,resources,warnings}_spec.rb": pdf
  "spec/stationery/{images,raster,monochrome}/**/*": images
  "spec/stationery/{images,raster,monochrome}_spec.rb": images
  "spec/stationery/svg/**/*": svg
  "spec/stationery/canvas/**/*": canvas
  "spec/stationery/canvas_spec.rb": canvas
  "spec/stationery/path_spec.rb": canvas
  "spec/stationery/{html,css,markdown,rich}/**/*": markup
  "spec/stationery/forms_*_spec.rb": forms
  "spec/stationery/forms_spec.rb": forms
  "spec/stationery/tagging/**/*": tagging
  "spec/stationery/tagging_*_spec.rb": tagging
  "spec/stationery/tagging_spec.rb": tagging
  "spec/stationery/verify/**/*": conformance
  "spec/stationery/verify_spec.rb": conformance
  "spec/stationery/{barcode,zpl}/**/*": barcodes
  "spec/stationery/{barcode,zpl}_spec.rb": barcodes
  "spec/stationery/{rails,railtie,preview}_spec.rb": rails
  "spec/stationery/cli/**/*": cli
  "spec/stationery/cli_spec.rb": cli
  "spec/stationery/testing/**/*": testing
  "spec/stationery/skill_spec.rb": dx
  ".github/**/*": devops
  "bin/release": devops
  "rakelib/**/*": devops
  "**/Dockerfile*": devops
  ".claude/**/*": dx
  "{AGENTS,CLAUDE}.md": dx
  "bin/labels": dx
  "docs/**/*": docs-site
