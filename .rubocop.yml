plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-thread_safety

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "**/tmp/**/*"
    - "**/vendor/**/*"
    - "bin/**/*"
    - "docs/**/*" # the docs site is its own Rails app with its own .rubocop.yml

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Binary parsers read naturally as one method per table/format; the specs pin
# their behaviour byte for byte.
Metrics/AbcSize:
  Max: 40
  Exclude:
    - "lib/stationery/path.rb" # Bezier geometry is arithmetic by nature
    - "lib/stationery/fonts/outline.rb" # the same, scaled into a Path
    - "lib/stationery/raster/flattener.rb" # curves to lines, point by point
    - "lib/stationery/raster/stroker.rb" # the geometry of joins, caps and dashes
    - "lib/stationery/raster/shading.rb" # a radial gradient's quadratic
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Metrics/MethodLength:
  Max: 30
  Exclude:
    - "lib/stationery/raster/flattener.rb" # one pass over a path's segments, kept in one loop for speed
    - "lib/stationery/raster/stroker.rb"
Metrics/BlockLength:
  Exclude:
    - "Rakefile" # the release task reads top to bottom on purpose
    - "lib/stationery/raster/flattener.rb"
Metrics/ClassLength:
  Max: 300
Metrics/ModuleLength:
  Max: 300
Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false
  Exclude:
    - "lib/stationery/svg/**/*" # arcs take the SVG spec's seven arguments

Naming/MethodParameterName:
  AllowedNames: [a, d, "on", cx, cy, op, qx, qy, ux, uy, x, y, w, h, r, g, b, c, m, k, io, id, iv, at, to, x1, y1, x2, y2, x3, y3, dx, dy, rx, ry, x0, y0, ox, oy, i, u, v]

# Encryption algorithms are named after the cipher and key size.
Naming/VariableNumber:
  AllowedIdentifiers: [aes_256, aes_128, rc4_128]

# RSpec matcher builders read as `have_…` by convention.
Naming/PredicatePrefix:
  Exclude:
    - "lib/stationery/testing/matchers.rb"

RSpec/ExampleLength:
  Max: 25
RSpec/MultipleExpectations:
  Max: 8
RSpec/NestedGroups:
  Max: 4
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
RSpec/SpecFilePathFormat:
  CustomTransform:
    WebP: webp
  Exclude:
    - "spec/rails/**/*" # the Rails lane lives apart from the Rails-free suite

# Font and image caches are process-global by design and guarded by a Mutex.
ThreadSafety/MutableClassInstanceVariable:
  Exclude: &caches
    - "lib/stationery.rb" # font_paths is appended to once, at boot
    - "lib/stationery/color.rb" # the colours parsed from Strings
    - "lib/stationery/fonts/registry.rb"
    - "lib/stationery/images/cache.rb"
# Document configuration is written while the class body is evaluated and
# only read afterwards.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - "lib/stationery/color.rb"
    - "lib/stationery/fonts/registry.rb"
    - "lib/stationery/images/cache.rb"
    - "lib/stationery/document.rb"
    - "lib/stationery/cli.rb" # commands register while their files load
ThreadSafety/NewThread:
  Exclude:
    - "spec/**/*"
